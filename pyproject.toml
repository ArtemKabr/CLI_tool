[tool.poetry]
name = "cli-tool"
version = "0.1.0"
description = "CLI tool for macroeconomic reports"
authors = ["Artem Kabr <your_email@example.com>"]
readme = "README.md"
packages = [{ include = "*" }]

[tool.poetry.dependencies]
python = "^3.12"
tabulate = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"